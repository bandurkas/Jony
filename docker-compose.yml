services:
  jony_loop:
    build: .
    command: python loop.py
    env_file: .env
    volumes:
      - jony_data:/app/data
    restart: unless-stopped

  jony_api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8200
    env_file: .env
    ports:
      - "8200:8200"
    volumes:
      - jony_data:/app/data
    restart: unless-stopped
    depends_on:
      - jony_loop

  jony_advisor:
    # no depends_on: advisory-only reader; must never trigger a jony_loop
    # recreate on its own rebuilds/runs
    build:
      context: .
      dockerfile: Dockerfile.advisor
    command: python advisor.py
    env_file: .env
    volumes:
      - jony_data:/app/data
    restart: unless-stopped

volumes:
  jony_data:
